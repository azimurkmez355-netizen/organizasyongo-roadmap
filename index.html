<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Organizasyongo.com — Yol Haritası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fa; --panel:#ffffff; --panel-2:#fafbfd; --line:#e4e7ee;
  --text:#14181f; --muted:#5f6a7d; --faint:#8a94a6;
  --grid:rgba(20,24,31,.045); --shadow:0 10px 30px rgba(25,30,45,.08);
  --accent:#f97316; --accent-soft:#ffb15c; --ok:#0d9f6e; --warn:#e08700;
  --tint:.12; --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e14; --panel:rgba(20,25,34,.82); --panel-2:rgba(14,18,26,.85); --line:#252c3a;
    --text:#edf0f6; --muted:#98a3b6; --faint:#6e7a8e;
    --grid:rgba(160,172,190,.05); --shadow:0 14px 40px rgba(0,0,0,.5);
    --accent:#ff932f; --accent-soft:#ffb15c; --ok:#31d39b; --warn:#f8b64c; --tint:.16;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e14; --panel:rgba(20,25,34,.82); --panel-2:rgba(14,18,26,.85); --line:#252c3a;
  --text:#edf0f6; --muted:#98a3b6; --faint:#6e7a8e;
  --grid:rgba(160,172,190,.05); --shadow:0 14px 40px rgba(0,0,0,.5);
  --accent:#ff932f; --accent-soft:#ffb15c; --ok:#31d39b; --warn:#f8b64c; --tint:.16;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background-image:
    radial-gradient(850px 480px at 10% -12%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 62%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:auto, 34px 34px, 34px 34px;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1400px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:100dvh}
@media (min-width:1000px){ .app{height:100dvh;overflow:hidden} }

/* ---- logo / header ---- */
.top{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brandmark{height:58px;width:auto;flex:none;filter:drop-shadow(0 6px 14px color-mix(in srgb,var(--accent) 30%,transparent))}
@media (max-width:520px){ .brandmark{height:46px} }
.head-r{display:flex;align-items:center;gap:8px}
.ghost{border:1px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;
  padding:9px 12px;border-radius:11px;cursor:pointer;transition:.18s}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--muted);
  border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}

/* ---- summary ---- */
.summary{display:grid;grid-template-columns:minmax(230px,1.3fr) repeat(3,minmax(92px,.55fr)) minmax(230px,1.5fr);gap:14px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  backdrop-filter:blur(16px);box-shadow:var(--shadow)}
@media (max-width:1080px){ .summary{grid-template-columns:repeat(3,1fr)} .prog,.focus{grid-column:1/-1} }
.label{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:800}
.prog .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.prog .pct{font-size:26px;font-weight:900;letter-spacing:-.03em}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--text) 10%,transparent);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .5s ease}
.prog .sub{margin-top:7px;font-size:11.5px;color:var(--faint)}
.kpi{border-left:1px solid var(--line);padding-left:13px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.kpi b{font-size:23px;font-weight:900;letter-spacing:-.02em;line-height:1}
.kpi span{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi.ok b{color:var(--ok)} .kpi.warn b{color:var(--warn)}
.focus{border-left:1px solid var(--line);padding-left:14px;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
@media (max-width:1080px){ .kpi,.focus{border-left:0;padding-left:0} }
.focus h3{margin:2px 0 0;font-size:14px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.focus p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---- board ---- */
.board{flex:1;min-height:0;overflow:auto;display:grid;gap:10px;align-content:start;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.board::-webkit-scrollbar{width:8px}
.board::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 13px 11px 16px;display:flex;flex-direction:column;gap:8px;transition:.18s;overflow:hidden;backdrop-filter:blur(14px)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--faint);opacity:.45}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:var(--shadow)}
.card[data-s="completed"]::before{background:var(--ok);opacity:1}
.card[data-s="in_progress"]::before{background:var(--accent);opacity:1}
.card[data-s="completed"]{background:linear-gradient(90deg,color-mix(in srgb,var(--ok) calc(var(--tint)*40%),transparent),transparent 45%),var(--panel)}
.card[data-s="in_progress"]{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) calc(var(--tint)*45%),transparent),transparent 48%),var(--panel);
  border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.head{display:flex;align-items:center;gap:9px}
.num{font-size:10.5px;font-weight:800;color:var(--faint);letter-spacing:.04em;flex:none}
.title{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
.card[data-s="completed"] .title{text-decoration:line-through;
  text-decoration-color:color-mix(in srgb,var(--ok) 60%,transparent);text-decoration-thickness:1.5px;opacity:.85}
.scope{margin:0;font-size:11.5px;line-height:1.55;color:var(--muted)}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.status{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);font:inherit;font-size:11px;font-weight:700;
  padding:6px 11px;border-radius:99px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
.status:hover{transform:translateY(-1px)}
.status .bead{width:7px;height:7px;border-radius:50%;background:currentColor}
.status[data-s="completed"]{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) var(--tint),transparent)}
.status[data-s="in_progress"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) var(--tint),transparent)}
.stamp{font-size:10px;color:var(--faint);font-weight:600}
.foot-note{font-size:10.5px;color:var(--faint);text-align:center}
kbd{font:inherit;font-size:9.5px;font-weight:700;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="brand">
      <svg class="brandmark" viewBox="0 0 600 220" role="img" aria-label="Organizasyongo.com logosu">
        <defs>
          <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FF5500"/>
            <stop offset="100%" stop-color="#FFAA00"/>
          </linearGradient>
        </defs>
        <style>
          .brand-black{font-family:'Inter','Helvetica Neue',Arial,sans-serif;font-weight:800;fill:var(--text);font-size:42px;letter-spacing:-1px}
          .brand-orange{font-family:'Inter','Helvetica Neue',Arial,sans-serif;font-weight:800;fill:#FF5500;font-size:42px;letter-spacing:-1px}
          .brand-domain{font-family:'Inter','Helvetica Neue',Arial,sans-serif;font-weight:400;fill:var(--faint);font-size:24px}
          .brand-sub{font-family:'Inter','Helvetica Neue',Arial,sans-serif;font-weight:500;fill:var(--faint);font-size:11px;letter-spacing:3.5px}
        </style>
        <g transform="translate(300, 45)">
          <g fill="url(#petalGrad)">
            <rect x="-5" y="-32" width="10" height="22" rx="5"/>
            <rect x="-5" y="-32" width="10" height="22" rx="5" transform="rotate(45)"/>
            <rect x="-5" y="-32" width="10" height="22" rx="5" transform="rotate(90)"/>
            <rect x="-5" y="-32" width="10" height="22" rx="5" transform="rotate(135)"/>
            <rect x="-5" y="-32" width="10" height="22" rx="5" transform="rotate(180)"/>
            <rect x="-5" y="-32" width="10" height="22" rx="5" transform="rotate(225)"/>
            <rect x="-5" y="-32" width="10" height="22" rx="5" transform="rotate(270)"/>
            <rect x="-5" y="-32" width="10" height="22" rx="5" transform="rotate(315)"/>
          </g>
          <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
          <circle cx="0" cy="0" r="6" fill="#111111"/>
        </g>
        <text x="300" y="125" text-anchor="middle">
          <tspan class="brand-black">Organizasyon</tspan><tspan class="brand-orange">go</tspan><tspan class="brand-domain">.com</tspan>
        </text>
        <text x="300" y="152" text-anchor="middle" class="brand-sub">DİJİTAL ETKİNLİK VE ORGANİZASYON PLATFORMU</text>
      </svg>
    </div>
    <div class="head-r">
      <span class="pill"><span class="dot"></span>Yol Haritası</span>
      <button class="ghost" id="themeBtn" title="Açık / koyu tema">🌓</button>
      <button class="ghost" id="resetBtn" title="Varsayılan duruma dön">↺ Sıfırla</button>
    </div>
  </div>

  <div class="summary">
    <div class="prog">
      <div class="row"><span class="label">Genel İlerleme</span><span class="pct" id="pct">%0</span></div>
      <div class="bar"><i id="barFill" style="width:0%"></i></div>
      <div class="sub" id="progSub">0 / 0 aşama tamamlandı</div>
    </div>
    <div class="kpi ok"><b id="kOk">0</b><span>Tamamlandı</span></div>
    <div class="kpi warn"><b id="kProg">0</b><span>Devam ediyor</span></div>
    <div class="kpi"><b id="kPend">0</b><span>Bekliyor</span></div>
    <div class="focus">
      <span class="label" id="focusLabel">Şu anki odak</span>
      <h3 id="focusTitle">—</h3>
      <p id="focusScope"></p>
    </div>
  </div>

  <div class="board" id="board"></div>
  <div class="foot-note">Durum rozetine tıkla: Bekliyor → Devam ediyor → Tamamlandı · <kbd>1</kbd>–<kbd>9</kbd>, <kbd>0</kbd> ile de aşama durumu değişir · Değişiklikler herkeste görünür. <span id="connState" style="color:var(--warn)"></span></div>
</div>

<script>
const TKEY='org_roadmap_theme';
const PHASES=[
 {id:1,title:'Backend Çekirdek',scope:'Auth, Categories, Providers, Requests, Offers, Credits, Reviews, Messaging',status:'completed'},
 {id:2,title:'Profil Zenginleştirme',scope:'Provider profil fotoğrafı (URL) ve sosyal medya linkleri',status:'completed'},
 {id:3,title:'Notifications',scope:'In-app bildirim + push altyapısı; gerçek FCM gönderimi mobil aşamasında',status:'completed'},
 {id:4,title:'Subscriptions',scope:'Plan ve durum yönetimi; ödeme entegrasyonu olmadan temel yapı',status:'completed'},
 {id:5,title:'Güvenlik Sertleştirme',scope:'Rate limiting, login/teklif spam kontrolü ve input sanitization incelemesi',status:'completed'},
 {id:6,title:'Backend Mobil-Hazır Kontrolü',scope:'Swagger, CLAUDE.md, API versiyonlama ve mobil istemci uyumluluğu',status:'in_progress'},
 {id:7,title:'Admin Panel (Refine.dev)',scope:'Kullanıcı, kategori, kredi tier ve platform ayarları yönetimi',status:'pending'},
 {id:8,title:'Web Frontend’i Olgunlaştırma',scope:'Gerçek UI/UX, arama, filtreleme ve profil düzenleme ekranları',status:'pending'},
 {id:9,title:'Mobil Uygulama (React Native + Expo)',scope:'Aynı backend API’sine bağlanan mobil istemci; kredi satın alma simülasyonu',status:'pending'},
 {id:10,title:'Ödeme Entegrasyonu',scope:'iyzico/PayTR seçimi ve entegrasyon; şirket kuruluşu paralel yürütülmeli',status:'pending'},
 {id:11,title:'KVKK / Yasal Metinler',scope:'Avukat ile gizlilik, kullanım koşulları ve KVKK metinleri',status:'pending'},
 {id:12,title:'Web Production Deploy',scope:'Railway backend ve Vercel web uygulamasını canlıya alma',status:'pending'},
 {id:13,title:'Store Yayınlama',scope:'TestFlight/Internal Testing ardından App Store ve Play Store süreçleri',status:'pending'}
];
const ST={completed:'Tamamlandı',in_progress:'Devam ediyor',pending:'Bekliyor'};
const NEXT={pending:'in_progress',in_progress:'completed',completed:'pending'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ts=>ts?new Date(ts).toLocaleDateString('tr-TR',{day:'2-digit',month:'short'}):'';

const API='/api/status';
let phases=PHASES.map(p=>({...p,ts:null}));
let lastKnown=null;

async function fetchStatuses(){
  try{
    const r=await fetch(API,{cache:'no-store'});
    if(!r.ok) throw new Error('status '+r.status);
    const data=await r.json();
    const changed=JSON.stringify(data)!==JSON.stringify(lastKnown);
    if(changed){
      phases.forEach(p=>{ if(ST[data[p.id]]) p.status=data[p.id]; });
      lastKnown=data; render();
    }
    setConn(true);
  }catch(e){
    console.warn('Sunucudan durum alınamadı:',e);
    setConn(false);
  }
}
async function pushStatus(id,status){
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});
    if(!r.ok) throw new Error('status '+r.status);
    lastKnown=await r.json();
    setConn(true);
  }catch(e){
    console.warn('Kaydedilemedi:',e);
    setConn(false);
  }
}
function setConn(ok){
  const el=$('connState'); if(!el) return;
  el.textContent = ok ? '' : '⚠︎ sunucuya ulaşılamıyor, değişiklik kaydedilemeyebilir';
}

function render(){
  const done=phases.filter(p=>p.status==='completed').length;
  const prog=phases.filter(p=>p.status==='in_progress').length;
  const pend=phases.filter(p=>p.status==='pending').length;
  const pct=Math.round(done/phases.length*100);
  $('pct').textContent='%'+pct; $('barFill').style.width=pct+'%';
  $('progSub').textContent=done+' / '+phases.length+' aşama tamamlandı';
  $('kOk').textContent=done; $('kProg').textContent=prog; $('kPend').textContent=pend;

  const active=phases.find(p=>p.status==='in_progress');
  const next=active||phases.find(p=>p.status==='pending');
  $('focusLabel').textContent=active?'Şu anki odak':(next?'Sıradaki aşama':'Durum');
  $('focusTitle').textContent=next?String(next.id).padStart(2,'0')+' · '+next.title:'Tüm aşamalar tamamlandı 🎉';
  $('focusScope').textContent=next?next.scope:'';

  $('board').innerHTML=phases.map(p=>`
    <article class="card" data-s="${p.status}">
      <div class="head">
        <span class="num">${String(p.id).padStart(2,'0')}</span>
        <h3 class="title">${esc(p.title)}</h3>
      </div>
      <p class="scope">${esc(p.scope)}</p>
      <div class="foot">
        <button class="status" data-s="${p.status}" data-id="${p.id}" title="Durumu ilerlet"><span class="bead"></span>${ST[p.status]}</button>
        <span class="stamp">${p.ts?'güncellendi · '+fmt(p.ts):''}</span>
      </div>
    </article>`).join('');
}

function cycle(id){
  const p=phases.find(x=>x.id===id); if(!p) return;
  const status=NEXT[p.status]||'pending';
  p.status=status; p.ts=Date.now(); render(); // önce ekranda göster (optimistic)
  pushStatus(id,status); // sonra sunucuya yaz
}
$('board').addEventListener('click',e=>{
  const b=e.target.closest('button[data-id]'); if(b) cycle(+b.dataset.id);
});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(/^[0-9]$/.test(e.key)){ const n=e.key==='0'?10:+e.key; if(phases.some(p=>p.id===n)) cycle(n); }
});
$('resetBtn').onclick=async()=>{
  if(!confirm('Tüm aşamalar başlangıç durumuna döndürülsün mü? Bu, herkeste değişir.')) return;
  phases=PHASES.map(p=>({...p,ts:null})); render();
  for(const p of PHASES){ await pushStatus(p.id,p.status); }
  fetchStatuses();
};
$('themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem(TKEY,next);}catch(e){}
};
try{ const th=localStorage.getItem(TKEY); if(th) document.documentElement.setAttribute('data-theme',th); }catch(e){}

render();               // varsayılan verilerle hemen göster
fetchStatuses();        // sunucudaki gerçek durumu çek
setInterval(fetchStatuses,8000); // diğer kullanıcıların değişikliklerini yakalamak için periyodik kontrol

</script>
</body>
</html>
